name: Gerar APKs FFMX

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-ffmx-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gerar APK do Painel
        run: gradle -p app-android assembleDebug --no-daemon
      - name: Gerar APK do Gerador
        run: gradle -p app-android/gerador assembleDebug --no-daemon
      - name: Gerar APK do FFMX PLAY
        run: gradle -p app-android :play:assembleDebug --no-daemon
      - name: Renomear APKs
        run: |
          cp app-android/app/build/outputs/apk/debug/app-debug.apk FFMX-Painel.apk
          cp app-android/gerador/app/build/outputs/apk/debug/app-debug.apk FFMX-Gerador.apk
          cp app-android/play/build/outputs/apk/debug/app-debug.apk FFMX-PLAY.apk
      - name: Disponibilizar APKs
        uses: actions/upload-artifact@v4
        with:
          name: FFMX-APKs
          path: |
            FFMX-Painel.apk
            FFMX-Gerador.apk
            FFMX-PLAY.apk
          if-no-files-found: error
