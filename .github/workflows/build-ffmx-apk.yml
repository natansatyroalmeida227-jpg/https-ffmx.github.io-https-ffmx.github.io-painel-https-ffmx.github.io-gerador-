name: Gerar APK FFMX

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-ffmx-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK de teste
        run: gradle -p app-android assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FFMX-APK
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
