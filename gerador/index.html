<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gerador FFMX</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><header class="topbar"><a href="../index.html">← FFMX</a><span class="badge">GERADOR</span></header><section class="panel"><h1>Gerador de perfil</h1><p class="muted">Monte uma configuração personalizada.</p><label>Nome do perfil<input id="nome" type="text" placeholder="Meu perfil"></label><label>Perfil<select id="perfil"><option>Equilibrado</option><option>Desempenho</option><option>Personalizado</option></select></label><label>Nível<input id="nivel" type="range" min="1" max="100" value="50"><output id="valor">50</output></label><button id="gerar" class="btn">Gerar configuração</button><pre id="resultado" class="result"></pre></section></main><script>const n=document.getElementById("nivel"),v=document.getElementById("valor");n.oninput=()=>v.textContent=n.value;document.getElementById("gerar").onclick=()=>{const nome=document.getElementById("nome").value.trim()||"Meu perfil",p=document.getElementById("perfil").value;document.getElementById("resultado").textContent=`FFMX - CONFIGURAÇÃO\nNome: ${nome}\nPerfil: ${p}\nNível: ${n.value}\n\nConfiguração gerada com sucesso.`};</script></body></html>
