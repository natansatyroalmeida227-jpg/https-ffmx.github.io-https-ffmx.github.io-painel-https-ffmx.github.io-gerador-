<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel FFMX</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif}.container{width:100%;max-width:700px;margin:auto;padding:20px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.topbar a{color:#ff2020;text-decoration:none;font-weight:bold}.badge{background:#ff2020;color:#fff;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:bold}.panel{background:#111;border:1px solid #2b2b2b;border-radius:18px;padding:25px;margin-bottom:18px;box-shadow:0 0 25px rgba(255,0,0,.08)}h1{margin-top:0}.muted{color:#999;line-height:1.5}.input{width:100%;padding:15px;border-radius:10px;border:1px solid #333;background:#070707;color:#fff;outline:none;margin-top:10px}.btn{width:100%;border:0;border-radius:10px;padding:15px;margin-top:15px;background:#ff2020;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}.btn:hover{background:#d90000}.status{min-height:22px;margin-top:15px;color:#ff5555}.success{color:#55e27a}.option{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 0;border-bottom:1px solid #252525}.option:last-of-type{border-bottom:0}.option span{display:flex;flex-direction:column;gap:6px}.option small{color:#999}.option input{width:24px;height:24px;accent-color:#ff2020}.logout{background:#222}.logout:hover{background:#333}
</style>
</head>
<body>
<main class="container">
<header class="topbar"><a href="../index.html">← FFMX</a><span class="badge">PAINEL</span></header>
<section class="panel" id="login">
<h1>🔐 Acesso ao Painel</h1>
<p class="muted">Digite a senha criada no Gerador FFMX.</p>
<input class="input" id="senha" type="password" placeholder="Digite sua senha" autocomplete="off">
<button class="btn" id="entrar">Abrir painel</button>
<a class="topbar" style="justify-content:center;margin-top:18px" href="../gerador/index.html">→ Abrir Gerador FFMX</a>
<p id="status" class="status"></p>
</section>
<section class="panel" id="conteudo" style="display:none">
<h1>🎮 Painel FFMX</h1>
<p class="muted">Ative ou desative as opções do painel.</p>
<label class="option"><span><strong>🎯 Aimbot</strong><small>Ativar opção Aimbot no painel.</small></span><input type="checkbox" id="aimbot"></label>
<label class="option"><span><strong>👁️ ESP</strong><small>Ativar opção ESP no painel.</small></span><input type="checkbox" id="esp"></label>
<label class="option"><span><strong>🔫 Bala Mágica</strong><small>Ativar opção Bala Mágica no painel.</small></span><input type="checkbox" id="balaMagica"></label>
<button class="btn" id="salvar">💾 Salvar</button>
<p id="saveStatus" class="status"></p>
<button class="btn logout" id="sair">Sair do painel</button>
</section>
</main>
<script>
const ids=["aimbot","esp","balaMagica"];
function carregar(){const saved=JSON.parse(localStorage.getItem("ffmxConfig")||"{}");ids.forEach(id=>{document.getElementById(id).checked=saved[id]===true})}
function entrar(){const senhaSalva=localStorage.getItem("ffmxSenha"),digitada=document.getElementById("senha").value,status=document.getElementById("status");if(!senhaSalva){status.textContent="Nenhuma senha foi criada. Abra o Gerador FFMX primeiro.";return}if(digitada===senhaSalva){document.getElementById("login").style.display="none";document.getElementById("conteudo").style.display="block";carregar();status.textContent=""}else status.textContent="Senha incorreta."}
document.getElementById("entrar").addEventListener("click",entrar);
document.getElementById("senha").addEventListener("keydown",e=>{if(e.key==="Enter")entrar()});
document.getElementById("salvar").addEventListener("click",()=>{const c={};ids.forEach(id=>c[id]=document.getElementById(id).checked);localStorage.setItem("ffmxConfig",JSON.stringify(c));const s=document.getElementById("saveStatus");s.textContent="Opções salvas!";s.className="status success"});
document.getElementById("sair").addEventListener("click",()=>{document.getElementById("conteudo").style.display="none";document.getElementById("login").style.display="block";document.getElementById("senha").value=""});
</script>
</body>
</html>
