<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Painel FFMX</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="container"><header class="topbar"><a href="../index.html">← FFMX</a><span class="badge">PAINEL</span></header><section class="panel"><h1>Configurações</h1><p class="muted">Ative ou desative as opções abaixo.</p><label class="setting"><span><strong>Modo desempenho</strong><small>Prioriza uma configuração mais leve.</small></span><input type="checkbox" id="desempenho"></label><label class="setting"><span><strong>Interface compacta</strong><small>Reduz espaçamentos da interface.</small></span><input type="checkbox" id="compacta"></label><label class="setting"><span><strong>Notificações</strong><small>Exibe mensagens de confirmação.</small></span><input type="checkbox" id="notificacoes" checked></label><button id="salvar" class="btn">Salvar configurações</button><p id="status" class="status"></p></section></main><script>const ids=["desempenho","compacta","notificacoes"],saved=JSON.parse(localStorage.getItem("ffmxConfig")||"{}");ids.forEach(id=>{if(typeof saved[id]==="boolean")document.getElementById(id).checked=saved[id]});document.getElementById("salvar").onclick=()=>{const c={};ids.forEach(id=>c[id]=document.getElementById(id).checked);localStorage.setItem("ffmxConfig",JSON.stringify(c));document.getElementById("status").textContent="Configurações salvas!"};</script></body></html>
