<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080808"><title>FFMX PLAY</title><link rel="stylesheet" href="style.css"></head><body>
<div id="menu" class="screen"><div class="logo">FFMX <span>PLAY</span></div><div class="card"><h2>Naylo</h2><p>Battle royale 3D</p><button id="start" class="primary">COMEÇAR</button><button id="inv">🎒 INVENTÁRIO</button></div></div>
<div id="lobby" class="screen hidden"><div class="card center"><div class="logo small">FFMX <span>PLAY</span></div><h2>LOBBY PERSONALIZADO</h2><div id="count">15</div><p>Partida começando em <b id="sec">15</b> segundos</p><p>👥 Jogadores: <b>1/12</b></p><button id="cancel">CANCELAR</button></div></div>
<div id="inventory" class="screen hidden"><div class="inv"><button id="close" class="close">✕</button><h1>🎒 MOCHILA</h1><p>Capacidade: <b>120 / 300</b></p><div class="items"><div>🔫<b>M4A1</b><small>30/120</small></div><div>🔫<b>MP40</b><small>20/100</small></div><div>🩹<b>Kit Médico</b><small>x5</small></div><div>🪖<b>Capacete Lv.3</b><small>x1</small></div><div>🦺<b>Colete Lv.3</b><small>x1</small></div><div>🎒<b>Mochila Lv.3</b><small>x1</small></div></div></div></div>
<div id="game" class="hidden"><canvas id="c"></canvas><div class="hud"><b>FFMX PLAY</b><span>Naylo ❤️ <b id="hp">100</b></span><span id="weapon">M4A1</span><button id="ginv">🎒</button></div><div id="crosshair"><span></span></div><div class="joy"><i></i></div><div class="buttons"><button id="jump">PULAR</button><button id="crouch">AGACHAR</button><button id="reload">RECARREGAR</button><button id="switch">PEGAR / TROCAR</button><button id="run">CORRER</button><button id="shoot" class="shoot">ATIRAR</button></div><div id="ammo">30 / 120</div><div id="msg"></div></div>
<script type="module" src="game_realista.js"></script></body></html>
